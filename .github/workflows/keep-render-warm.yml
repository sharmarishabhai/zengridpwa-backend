name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: curl --fail --silent --show-error --max-time 30 https://zengridpwa-backend.onrender.com/api/health
